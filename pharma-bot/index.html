<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PharmaHelper Chatbot</title>
<style>
  body { font-family: Arial, sans-serif; background: #f2f6f9; display: flex; justify-content: center; padding: 20px; }
  #wrap { width: 100%; max-width: 420px; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.15); overflow: hidden; }
  #head { background: #0a7d5a; color: #fff; padding: 14px; font-weight: bold; }
  #chat-box { height: 380px; overflow-y: auto; padding: 12px; }
  .msg { margin: 8px 0; padding: 8px 12px; border-radius: 10px; max-width: 80%; white-space: pre-wrap; }
  .user { background: #d9f2e9; margin-left: auto; }
  .bot { background: #eef1f4; }
  #row { display: flex; border-top: 1px solid #ddd; }
  #msg { flex: 1; border: 0; padding: 12px; outline: none; }
  button { border: 0; background: #0a7d5a; color: #fff; padding: 0 18px; cursor: pointer; }
  small { display: block; text-align: center; color: #777; padding: 6px; font-size: 11px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="head">PharmaHelper</div>
  <div id="chat-box"></div>
  <div id="row">
    <input id="msg" placeholder="Apna sawaal likhein..." />
    <button onclick="send()">Send</button>
  </div>
  <small>Ye bot medical advice nahi deta. Emergency mein doctor se milein.</small>
</div>

<script>
const history = [];
const box = document.getElementById("chat-box");
const input = document.getElementById("msg");
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text; // textContent = safe, HTML inject nahi hoga
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  history.push({ role: "user", content: text });
  add("user", text);
  add("bot", "...");
  const typing = box.lastChild;
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history }),
    });
    const data = await r.json();
    typing.textContent = data.reply;
    history.push({ role: "assistant", content: data.reply });
  } catch (e) {
    typing.textContent = "Network error, dobara try karein.";
  }
}
</script>
</body>
</html>
